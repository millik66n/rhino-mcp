[project]
name = "rhino-mcp"
version = "0.2.2"
description = "Rhino and Grasshopper integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "millik66n"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/millik66n/rhino-mcp"
Repository = "https://github.com/millik66n/rhino-mcp"
Issues = "https://github.com/millik66n/rhino-mcp/issues"

[project.scripts]
rhino-mcp = "rhino_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "rhino_mcp"}

[tool.setuptools.packages.find]
where = ["rhino_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
