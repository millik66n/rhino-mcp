name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check rhino_mcp tests
      - run: pytest -q

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: ./scripts/build-yak.sh Release
      - uses: actions/upload-artifact@v7
        with:
          name: rhino-mcp-yak
          path: dist/*.yak

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: rhino-mcp-python
          path: dist/*

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: python -m pip install -e ".[dev]" "pyinstaller==6.22.2"
      - run: choco install innosetup --yes --no-progress
      - run: ./scripts/build-windows-installer.ps1
      - run: |
          $installer = Get-Item "dist/RhinoMCP-Windows-Setup-*.exe"
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small." }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: rhino-mcp-windows-installer
          path: dist/RhinoMCP-Windows-Setup-*.exe
