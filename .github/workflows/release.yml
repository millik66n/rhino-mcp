name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: python -m pip install . build twine "pyinstaller==6.22.2"
      - run: python -m build
      - run: twine check dist/*.whl dist/*.tar.gz
      - run: choco install innosetup --yes --no-progress
      - run: ./tests/test-windows-package-upgrade.ps1
      - run: ./scripts/build-windows-installer.ps1
      - run: |
          $installer = Get-Item "dist/RhinoMCP-Windows-Setup-*.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $checksum = Join-Path "dist" "$($installer.Name).sha256"
          [IO.File]::WriteAllText(
            $checksum,
            "$hash  $($installer.Name)`n",
            [Text.UTF8Encoding]::new($false)
          )
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/RhinoMCP-Windows-Setup-*.exe
            dist/RhinoMCP-Windows-Setup-*.exe.sha256
            dist/*.whl
            dist/*.tar.gz
            dist/*.yak
